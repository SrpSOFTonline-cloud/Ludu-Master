<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUDU MASTER</title>

<style>
body{
 margin:0;
 background:#121212;
 font-family:Arial;
 color:white;
 text-align:center;
}

h1{margin:10px}

#menu{
 position:fixed;
 inset:0;
 background:#000d;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:15px;
 z-index:5;
}

button{
 padding:12px 25px;
 font-size:18px;
 border:none;
 border-radius:8px;
 background:orange;
 cursor:pointer;
}

#board{
 width:95vw;
 max-width:520px;
 height:95vw;
 max-height:520px;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(15,1fr);
 grid-template-rows:repeat(15,1fr);
}

.cell{border:1px solid #999; position:relative}
.path{background:#eee}

.redBase{background:#ff3b3b}
.greenBase{background:#1db954}
.blueBase{background:#2d8cff}
.yellowBase{background:#ffd633}

.token{
 width:60%;
 height:60%;
 border-radius:50%;
 position:absolute;
 top:20%;
 left:20%;
 cursor:pointer;
}

.red{background:red}
.green{background:green}
.blue{background:blue}
.yellow{background:gold}

.safe{background:#ccc}

#dice{font-size:35px;margin-top:10px}

</style>
</head>
<body>

<h1>🎲 LUDU MASTER</h1>

<div id="menu">
<h2>Select Game Mode</h2>
<button onclick="startGame('offline')">Offline 4 Player</button>
<button onclick="startGame('bot')">Play With Robot</button>
</div>

<div id="board"></div>
<div id="dice">🎲</div>
<button onclick="rollDice()">Roll Dice</button>
<div id="status"></div>

<script>
const board=document.getElementById("board");
const status=document.getElementById("status");
const diceUI=document.getElementById("dice");

let mode="offline";
let diceValue=0;

function startGame(m){
 mode=m;
 document.getElementById("menu").style.display="none";
 status.innerText="RED Turn";
}

// Build Board
let cells=[];
for(let r=0;r<15;r++){
 for(let c=0;c<15;c++){
  let div=document.createElement("div");
  div.className="cell";

  if(r<6 && c<6) div.classList.add("redBase");
  else if(r<6 && c>8) div.classList.add("blueBase");
  else if(r>8 && c<6) div.classList.add("greenBase");
  else if(r>8 && c>8) div.classList.add("yellowBase");
  else div.classList.add("path");

  board.appendChild(div);
  cells.push(div);
 }
}

// Safe Star Box
const safeBoxes=[91,25,133,67];
safeBoxes.forEach(i=>cells[i].classList.add("safe"));

// Path
const path=[91,92,93,94,95,80,65,50,35,20,21,22,23,24,25,40,55,70,85,100,115,130,131,132,133,134,135,120,105,90,75,60,45,30,31,32,33,34];

const players=["red","blue","yellow","green"];
let turn=0;

// 4 Token Per Player
let tokens={};
players.forEach(p=>{
 tokens[p]=[ {pos:-1},{pos:-1},{pos:-1},{pos:-1} ];
});

function drawTokens(){
 document.querySelectorAll(".token").forEach(e=>e.remove());

 players.forEach(p=>{
  tokens[p].forEach((t,index)=>{
   if(t.pos>=0 && t.pos<path.length){
    let token=document.createElement("div");
    token.className="token "+p;

    if(p===players[turn]){
     token.onclick=()=>moveToken(p,index);
    }

    cells[path[t.pos]].appendChild(token);
   }
  });
 });
}

function rollDice(){
 diceValue=Math.floor(Math.random()*6)+1;
 diceUI.innerText="🎲 "+diceValue;
}

function moveToken(player,index){
 if(player!==players[turn]) return;
 if(diceValue===0) return;

 let t=tokens[player][index];

 if(t.pos===-1 && diceValue===6){
  t.pos=0;
 }
 else if(t.pos>=0){
  t.pos+=diceValue;
  if(t.pos>=path.length) t.pos=path.length-1;
 }

 killCheck(player,index);
 diceValue=0;
 drawTokens();

 if(mode==='bot' && player==='green'){
  setTimeout(botMove,800);
 }
 else{
  turn=(turn+1)%4;
 }

 status.innerText=players[turn].toUpperCase()+" Turn";
}

function killCheck(player,index){
 let pos=tokens[player][index].pos;
 if(safeBoxes.includes(path[pos])) return;

 players.forEach(p=>{
  if(p!==player){
   tokens[p].forEach(t=>{
    if(t.pos===pos) t.pos=-1;
   });
  }
 });
}

function botMove(){
 rollDice();
 let botTokens=tokens['green'];
 let index=botTokens.findIndex(t=>t.pos>=0 || diceValue===6);
 if(index!==-1) moveToken('green',index);
}

</script>

</body>
</html>
