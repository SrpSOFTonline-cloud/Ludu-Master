<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUDU MASTER - SRP SOFT.LTD</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#111;
color:white;
display:flex;
flex-direction:column;
align-items:center;
}

h1{margin:10px}

#board{
width:360px;
height:360px;
display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);
border:4px solid white;
position:relative;
}

.cell{
border:1px solid #222;
}

.safe{background:gold}

.token{
width:18px;
height:18px;
border-radius:50%;
position:absolute;
border:2px solid white;
cursor:pointer;
}

.red{background:red}
.blue{background:blue}
.green{background:green}
.yellow{background:gold}

button{
padding:10px 20px;
margin:10px;
font-size:18px;
}

#winner{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
font-size:40px;
}

</style>
</head>

<body>

<h1>🎮 LUDU MASTER</h1>

<div id="board"></div>
<button onclick="rollDice()">🎲 Roll Dice</button>

<div id="winner"></div>

<script>
const board=document.getElementById("board")
const winnerDiv=document.getElementById("winner")

// ===== BOARD CREATE =====
for(let i=0;i<225;i++){
let cell=document.createElement("div")
cell.className="cell"
board.appendChild(cell)
}

// ===== PATH =====
const path=[
210,211,212,213,214,199,184,169,154,139,124,109,94,79,64,65,66,67,68,83,98,113,128,143,158,173,188,203,204,205,206,207,208,193,178,163,148,133,118,103,88,73,58,57,56,55,54,69,84,99,114,129
]

// ===== TOKENS =====
let tokens=[
{color:"red",pos:-1,home:0},
{color:"blue",pos:-1,home:0},
{color:"green",pos:-1,home:0},
{color:"yellow",pos:-1,home:0}
]

let currentPlayer=0
let diceValue=0

function drawTokens(){
// remove old tokens
const old=document.querySelectorAll(".token")
old.forEach(t=>t.remove())

// draw tokens
 tokens.forEach((t,index)=>{
 if(t.pos===-1) return

 let cellIndex=path[t.pos]
 let cell=board.children[cellIndex]
 let rect=cell.getBoundingClientRect()
 let boardRect=board.getBoundingClientRect()

 let token=document.createElement("div")
 token.className=`token ${t.color}`
 token.style.left=(rect.left-boardRect.left+3)+"px"
 token.style.top=(rect.top-boardRect.top+3)+"px"
 token.onclick=()=>moveToken(index)

 board.appendChild(token)
 })
}

function rollDice(){
 diceValue=Math.floor(Math.random()*6)+1
 alert("Dice: "+diceValue)

 if(diceValue===6 && tokens[currentPlayer].pos===-1){
 tokens[currentPlayer].pos=0
 drawTokens()
 return
 }
}

function moveToken(i){
 if(i!==currentPlayer) return
 if(tokens[i].pos===-1) return

 tokens[i].pos+=diceValue

 if(tokens[i].pos>=path.length-1){
 winnerDiv.style.display="flex"
 winnerDiv.innerText=tokens[i].color.toUpperCase()+" WINS 🏆"
 }

 drawTokens()
 currentPlayer=(currentPlayer+1)%4
}

</script>

</body>
</html>
